<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PingWin — AI Lua Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #242736;
      --border:   #2a2d3e;
      --accent:   #7c6af7;
      --accent2:  #5eead4;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --error:    #f87171;
      --radius:   12px;
      --mono:     "JetBrains Mono", "Fira Code", "Consolas", monospace;
      --sans:     "Inter", system-ui, -apple-system, sans-serif;
      --sidebar-w: 280px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.35s cubic-bezier(.4,0,.2,1),
                  min-width 0.35s cubic-bezier(.4,0,.2,1),
                  opacity 0.25s ease;
      overflow: hidden;
      position: relative;
      z-index: 20;
    }
    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      border-right: none;
      opacity: 0;
      pointer-events: none;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 280px;
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Logo ───────────────────────────────────────────────── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #000080, #7c6af7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 2px 10px rgba(124,106,247,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .logo:hover .logo-icon {
      transform: scale(1.08);
      box-shadow: 0 4px 18px rgba(124,106,247,0.45);
    }
    /* Полумесяц Луа внутри иконки */
    .logo-icon .moon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e2e8f0;
      position: relative;
    }
    .logo-icon .moon::after {
      content: '';
      position: absolute;
      top: -2px;
      right: -3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #000080, #7c6af7);
    }
    .logo-text-group {
      display: flex;
      align-items: baseline;
      gap: 0;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 800;
      font-family: var(--mono);
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo-underscore {
      color: var(--accent);
      animation: blink-underscore 1.1s step-end infinite;
    }
    @keyframes blink-underscore {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(0,0,128,0.15);
      color: #8b8bf5;
      border: 1px solid rgba(0,0,128,0.3);
      font-family: var(--sans);
      margin-left: 8px;
      letter-spacing: 0.3px;
    }

    /* ── Sidebar Toggle ─────────────────────────────────────── */
    .btn-sidebar-toggle {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-sidebar-toggle:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-sidebar-toggle svg { width: 16px; height: 16px; }

    .sidebar-expand-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .sidebar-expand-btn.visible { display: flex; }
    .sidebar-expand-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .sidebar-expand-btn svg { width: 20px; height: 20px; }

    .btn-new-chat {
      width: 100%;
      padding: 10px;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--sans);
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-new-chat:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #7c6af710;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      min-width: 280px;
    }
    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
    }
    .history-item:hover { background: var(--surface2); color: var(--text); }
    .history-item.active { background: var(--border); color: #fff; }
    .history-item-text {
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .history-item-del {
      margin-left: auto;
      padding-left: 10px;
      opacity: 0;
      color: var(--error);
      font-size: 12px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .history-item:hover .history-item-del { opacity: 1; }
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 12px;
      min-width: 280px;
    }
    .sidebar-footer a { color: var(--muted); text-decoration: none; }
    .sidebar-footer a:hover { color: var(--text); }

    /* ── Main Chat Area ─────────────────────────────────────── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 30px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .msg {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .msg.user .msg-avatar {
      background: var(--accent);
      border: none;
    }
    .msg-avatar .avatar-moon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e2e8f0;
      position: relative;
    }
    .msg-avatar .avatar-moon::after {
      content: '';
      position: absolute;
      top: -2px;
      right: -2px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--surface2);
    }
    .msg.user .msg-avatar .avatar-moon::after {
      background: var(--accent);
    }
    .msg-body { flex: 1; min-width: 0; }
    .msg-role {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .msg.user .msg-role { color: var(--accent); }
    .msg-content {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }

    /* Loading */
    .loading-dots {
      display: inline-flex;
      gap: 6px;
      padding: 8px 0;
    }
    .loading-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Code Block */
    .code-wrapper {
      position: relative;
      margin-top: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .code-header {
      background: var(--surface2);
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .copy-btn {
      padding: 3px 10px;
      font-size: 11px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .2s;
      font-family: var(--sans);
    }
    .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .code-body {
      background: var(--bg);
      padding: 16px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.7;
      color: #a9b4c8;
      overflow-x: auto;
      white-space: pre;
    }
    .code-body .kw  { color: #c792ea; }
    .code-body .fn  { color: #82aaff; }
    .code-body .str { color: #c3e88d; }
    .code-body .num { color: #f78c6c; }
    .code-body .cmt { color: #546e7a; font-style: italic; }

    .error-block {
      margin-top: 12px;
      background: #f8717110;
      border: 1px solid #f8717140;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--error);
      white-space: pre-wrap;
      font-family: var(--mono);
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px;
      text-align: center;
    }
    .empty-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #000080, #7c6af7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(124,106,247,0.25);
      animation: float-icon 4s ease-in-out infinite;
    }
    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .empty-icon .moon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e2e8f0;
      position: relative;
    }
    .empty-icon .moon::after {
      content: '';
      position: absolute;
      top: -4px;
      right: -5px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #000080, #7c6af7);
    }
    .empty-title {
      font-size: 28px;
      font-weight: 800;
      font-family: var(--mono);
      background: linear-gradient(135deg, #7c6af7, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .empty-sub { color: var(--muted); font-size: 14px; max-width: 440px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
    .chip {
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
      font-family: var(--sans);
    }
    .chip:hover {
      background: #7c6af720;
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* ── Input Area ─────────────────────────────────────────── */
    .input-area {
      padding: 16px 24px 24px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
      display: flex;
      justify-content: center;
    }
    .input-box {
      max-width: 800px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: flex-start;
      padding: 12px 16px;
      transition: border-color .2s;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .input-box:focus-within { border-color: var(--accent); }
    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      padding: 6px 0;
      resize: none;
      outline: none;
      height: 24px;
      min-height: 24px;
      max-height: 200px;
      overflow-y: auto;
    }
    .input-box textarea::placeholder { color: var(--muted); }
    .btn-send {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 12px;
      transition: opacity .2s, transform .1s;
      margin-top: 2px;
    }
    .btn-send:hover { opacity: 0.9; transform: scale(1.05); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }
    .input-hint kbd {
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-family: inherit;
    }

    /* ── Scrollbar ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Mobile ─────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 50;
        box-shadow: 4px 0 24px rgba(0,0,0,0.5);
      }
      .sidebar.collapsed { box-shadow: none; }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 40;
      }
      .sidebar-overlay.visible { display: block; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <button class="sidebar-expand-btn" id="sidebar-expand-btn" onclick="toggleSidebar()" aria-label="Открыть панель">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-row">
        <div class="logo">
          <div class="logo-icon"><div class="moon"></div></div>
          <div class="logo-text-group">
            <span class="logo-text">PingWin</span><span class="logo-underscore">_</span>
            <span class="badge">lua</span>
          </div>
        </div>
        <button class="btn-sidebar-toggle" onclick="toggleSidebar()" aria-label="Свернуть панель">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </div>
      <button class="btn-new-chat" onclick="createNewChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Новый чат
      </button>
    </div>
    <div class="history-list" id="history-list"></div>
    <div class="sidebar-footer">
      <a href="/docs" target="_blank">Swagger UI</a>
      <a href="/redoc" target="_blank">ReDoc</a>
    </div>
  </aside>

  <!-- ── Main Chat ──────────────────────────────────────────── -->
  <main class="chat-container">

    <div class="empty-state" id="empty-state">
      <div class="empty-icon"><div class="moon"></div></div>
      <div class="empty-title">PingWin_ lua</div>
      <div class="empty-sub">
        Опишите задачу для LowCode-платформы MWS Octapi, и ИИ напишет готовый Lua-скрипт с проверкой синтаксиса.
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="messages" id="messages" style="display: none;"></div>

    <div class="input-area">
      <div style="width: 100%; max-width: 800px;">
        <div class="input-box">
          <textarea id="prompt" placeholder="Напишите задачу для генерации Lua-кода..." oninput="autoResize(this)"></textarea>
          <button class="btn-send" id="send-btn" onclick="runGenerate()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
        <div class="input-hint">Нажмите <kbd>Ctrl</kbd> + <kbd>Enter</kbd> для отправки</div>
      </div>
    </div>

  </main>

<script>
  const EXAMPLES = [
    "Функция factorial(n) для n >= 0",
    "Получить последний элемент массива wf.vars.emails",
    "Счётчик попыток: увеличить try_count_n на 1",
    "Фильтровать parsedCsv: оставить с Discount или Markdown",
    "Конвертировать recallTime из ISO 8601 в Unix epoch",
    "Привести items в массиве к типу array"
  ];

  const chipsEl = document.getElementById("chips");
  EXAMPLES.forEach(ex => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = ex;
    c.onclick = () => {
      document.getElementById("prompt").value = ex;
      document.getElementById("prompt").focus();
    };
    chipsEl.appendChild(c);
  });

  /* ── Sidebar Toggle ─────────────────────────────────────── */
  let sidebarOpen = true;

  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    const sidebar = document.getElementById('sidebar');
    const expandBtn = document.getElementById('sidebar-expand-btn');
    const overlay = document.getElementById('sidebar-overlay');

    if (sidebarOpen) {
      sidebar.classList.remove('collapsed');
      expandBtn.classList.remove('visible');
      overlay.classList.remove('visible');
    } else {
      sidebar.classList.add('collapsed');
      expandBtn.classList.add('visible');
      overlay.classList.remove('visible');
    }
  }

  /* ── State & LocalStorage ───────────────────────────────── */
  let chats = JSON.parse(localStorage.getItem('pw_chats') || '[]');
  let activeChatId = null;
  let isGenerating = false;

  function saveChats() {
    localStorage.setItem('pw_chats', JSON.stringify(chats));
  }

  function getActiveChat() {
    return chats.find(c => c.id === activeChatId);
  }

  /* ── Chat Management ────────────────────────────────────── */
  function createNewChat() {
    const newChat = {
      id: Date.now().toString(),
      title: 'Новый чат',
      messages: []
    };
    chats.unshift(newChat);
    activeChatId = newChat.id;
    saveChats();
    renderSidebar();
    renderChat();
    document.getElementById('prompt').focus();
  }

  function selectChat(id) {
    if (isGenerating) return;
    activeChatId = id;
    renderSidebar();
    renderChat();
    if (window.innerWidth <= 768 && sidebarOpen) toggleSidebar();
  }

  function deleteChat(id, e) {
    e.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    if (activeChatId === id) {
      activeChatId = chats.length > 0 ? chats[0].id : null;
    }
    saveChats();
    renderSidebar();
    renderChat();
  }

  /* ── UI Rendering ───────────────────────────────────────── */
  function renderSidebar() {
    const list = document.getElementById("history-list");
    list.innerHTML = '';
    chats.forEach(chat => {
      const div = document.createElement("div");
      div.className = `history-item ${chat.id === activeChatId ? 'active' : ''}`;
      div.onclick = () => selectChat(chat.id);

      const textSpan = document.createElement("span");
      textSpan.className = "history-item-text";
      textSpan.textContent = chat.title;
      div.appendChild(textSpan);

      const delBtn = document.createElement("span");
      delBtn.className = "history-item-del";
      delBtn.innerHTML = "&#10005;";
      delBtn.onclick = (e) => deleteChat(chat.id, e);
      div.appendChild(delBtn);

      list.appendChild(div);
    });
  }

  function renderChat() {
    const msgContainer = document.getElementById('messages');
    const emptyState = document.getElementById('empty-state');
    const chat = getActiveChat();

    if (!chat || chat.messages.length === 0) {
      msgContainer.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }

    emptyState.style.display = 'none';
    msgContainer.style.display = 'flex';
    msgContainer.innerHTML = '';

    chat.messages.forEach(msg => {
      appendMessageToDOM(msg.role, msg.content, msg.code, msg.error, false);
    });

    scrollToBottom();
  }

  function appendMessageToDOM(role, text, code = null, error = null, scroll = true) {
    const msgContainer = document.getElementById('messages');
    const div = document.createElement("div");
    div.className = `msg ${role}`;

    const roleName = role === 'user' ? 'Вы' : 'PingWin_';

    let contentHTML = text ? `<p>${text.replace(/\n/g, '<br>')}</p>` : '';

    if (code) {
      contentHTML += `
        <div class="code-wrapper">
          <div class="code-header">
            <span>lua</span>
            <button class="copy-btn" onclick="copyCode(this)">Копировать код</button>
          </div>
          <div class="code-body">${highlightLua(code)}</div>
        </div>`;
    }

    if (error) {
      contentHTML += `<div class="error-block">&#9888;&#65039; ${error}</div>`;
    }

    div.innerHTML = `
      <div class="msg-avatar"><div class="avatar-moon"></div></div>
      <div class="msg-body">
        <div class="msg-role">${roleName}</div>
        <div class="msg-content">${contentHTML}</div>
      </div>
    `;

    msgContainer.appendChild(div);
    if (scroll) scrollToBottom();
  }

  function showLoading() {
    const msgContainer = document.getElementById('messages');
    const div = document.createElement("div");
    div.className = "msg assistant";
    div.id = "loading-msg";
    div.innerHTML = `
      <div class="msg-avatar"><div class="avatar-moon"></div></div>
      <div class="msg-body">
        <div class="msg-role">PingWin_</div>
        <div class="msg-content">
          <div class="loading-dots"><span></span><span></span><span></span></div>
          <p style="font-size: 12px; color: var(--muted); margin-top: 8px;">Анализирую задачу, ищу примеры в базе и генерирую код...</p>
        </div>
      </div>
    `;
    msgContainer.appendChild(div);
    scrollToBottom();
  }

  function removeLoading() {
    const el = document.getElementById("loading-msg");
    if (el) el.remove();
  }

  function scrollToBottom() {
    const mc = document.getElementById('messages');
    mc.scrollTop = mc.scrollHeight;
  }

  /* ── Helpers ────────────────────────────────────────────── */
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function highlightLua(code) {
    const esc = code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return esc
      .replace(/(--[^\n]*)/g, '<span class="cmt">$1</span>')
      .replace(/\b(function|return|if|then|else|elseif|end|for|do|while|repeat|until|local|nil|true|false|not|and|or|in)\b/g, '<span class="kw">$1</span>')
      .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="str">$1</span>')
      .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');
  }

  async function copyCode(btn) {
    const codeBlock = btn.closest('.code-wrapper').querySelector('.code-body');
    await navigator.clipboard.writeText(codeBlock.innerText);
    const orig = btn.textContent;
    btn.textContent = "Скопировано!";
    setTimeout(() => btn.textContent = orig, 1500);
  }

  /* ── Core API Logic ─────────────────────────────────────── */
  async function runGenerate() {
    const promptEl = document.getElementById("prompt");
    const promptText = promptEl.value.trim();
    if (!promptText || isGenerating) return;

    if (!activeChatId) createNewChat();
    const chat = getActiveChat();

    chat.messages.push({ role: 'user', content: promptText });

    if (chat.messages.length === 1) {
      chat.title = promptText.substring(0, 40) + (promptText.length > 40 ? "..." : "");
    }

    saveChats();
    promptEl.value = '';
    autoResize(promptEl);

    isGenerating = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('messages').style.display = 'flex';

    appendMessageToDOM('user', promptText);
    showLoading();
    renderSidebar();

    try {
      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: promptText }),
      });

      removeLoading();
      const data = await res.json();

      if (res.ok) {
        chat.messages.push({
          role: 'assistant',
          content: null,
          code: data.code,
          error: null
        });
        appendMessageToDOM('assistant', null, data.code);
      } else {
        const errText = data.detail?.message || "Неизвестная ошибка";
        const partialCode = data.detail?.partial_code || null;
        chat.messages.push({
          role: 'assistant',
          content: errText,
          code: partialCode,
          error: errText
        });
        appendMessageToDOM('assistant', errText, partialCode, errText);
      }
      saveChats();

    } catch (err) {
      removeLoading();
      appendMessageToDOM('assistant', `Сетевая ошибка: ${err.message}`, null, err.message);
    } finally {
      isGenerating = false;
      document.getElementById('send-btn').disabled = false;
      promptEl.focus();
    }
  }

  /* ── Init ───────────────────────────────────────────────── */
  document.getElementById('prompt').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      runGenerate();
    }
  });

  if (chats.length === 0) {
    createNewChat();
  } else {
    activeChatId = chats[0].id;
    renderSidebar();
    renderChat();
  }
</script>
</body>
</html>
